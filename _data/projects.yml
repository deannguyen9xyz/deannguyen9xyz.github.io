# Projects page content, grouped by section (rendered by _pages/projects.md).
# image: file name in /images/projects/ (leave out for a text-only card).

- category: "MIPs, materials and molecular modelling"
  items:
    - name: "SEM-BSE-image-analysis-MIP-RuO2"
      url: "https://github.com/deannguyen9xyz/SEM-BSE-image-analysis-MIP-RuO2"
      description: "Corrects backscattered-electron SEM images for emission-current differences between sessions and compares bare and MIP-modified RuO₂ screen-printed electrodes."
    - name: "Python-Molecular-Docking"
      url: "https://github.com/deannguyen9xyz/Python-Molecular-Docking"
      image: "Python-Molecular-Docking.png"
      alt: "Docked ligand in the binding pocket of trypsin"
      description: "Docking workflow following the RCSB PDB-101 Python training: ligand preparation with Meeko, docking with AutoDock Vina and interaction fingerprints with ProLIF."
    - name: "dsdna-iqs-docking-pipeline"
      url: "https://github.com/deannguyen9xyz/dsdna-iqs-docking-pipeline"
      image: "dsdna-iqs-docking-pipeline.png"
      alt: "IQS docked in the groove of a DNA duplex, next to the screening funnel from 10,000 sequences down to 20 candidates"
      description: "Virtual screening of 10,000 random dsDNA sequences down to 20 candidates for binding IQS, a Pseudomonas aeruginosa quorum sensing signal: sequence filters, nearest-neighbour duplex thermodynamics and AutoDock Vina docking, with a script that re-derives every result from the raw files."
    - name: "dsDNA-PQS-docking"
      url: "https://github.com/deannguyen9xyz/dsDNA-PQS-docking"
      image: "dsDNA-PQS-docking.png"
      alt: "PQS docked in the groove of a DNA duplex, beside mean binding affinities for 15 candidate sequences shown with error bars"
      description: "Docking workflow for selecting dsDNA sequences as recognition elements for PQS: 31 candidates screened to 15 on length and GC content, then five independent AutoDock Vina runs each, with the four taken forward for synthesis chosen on consistency across replicates rather than on a single best score."
    - name: "MIP-eQCM-Theory-Handbook"
      url: "https://github.com/deannguyen9xyz/MIP-eQCM-Theory-Handbook"
      description: "Theory notes on molecularly imprinted polymers (imprinting approaches, computational monomer selection, electropolymerization, class-selective MIPs) and on the electrochemical quartz crystal microbalance (working principle and equivalent circuit model)."

- category: "Electrochemical simulation and data analysis"
  items:
    - name: "CV-simulation"
      url: "https://github.com/deannguyen9xyz/CV-simulation"
      image: "CV-simulation.png"
      alt: "Simulated cyclic voltammograms, first and second cycle"
      description: "Simulates cyclic voltammetry of a reversible redox couple at a planar electrode by solving Fick's second law with an explicit finite-difference scheme under Nernstian conditions."
    - name: "SWV-Simulator"
      url: "https://github.com/deannguyen9xyz/SWV-Simulator"
      image: "SWV-Simulator.png"
      alt: "Simulated square-wave voltammogram with fitted linear baseline and peak height"
      description: "Simulates square-wave voltammograms with a charging-current baseline, then extracts the faradaic peak height by sliding-window linear baseline fitting."
    - name: "PINN-diffusion-study"
      url: "https://github.com/deannguyen9xyz/PINN-diffusion-study"
      image: "PINN-diffusion-study.png"
      alt: "Concentration map and concentration profiles predicted by the physics-informed neural network"
      description: "A physics-informed neural network (PyTorch) that solves the diffusion equation for concentration depletion near an electrode, trained on the governing equation and boundary conditions instead of data."
    - name: "CV-anodic-peak-extraction"
      url: "https://github.com/deannguyen9xyz/CV-anodic-peak-extraction"
      image: "CV-anodic-peak-extraction.png"
      alt: "Anodic sweep of a cyclic voltammogram with linear baseline and measured peak current"
      description: "Notebook that fits a linear baseline in a pre-peak window and extracts anodic peak currents from multi-cycle CV exports (PalmSens PSTrace), averaged over consecutive scans."
    - name: "originlab-voltammetry-peaks"
      url: "https://github.com/deannguyen9xyz/originlab-voltammetry-peaks"
      description: "Python script for OriginLab that finds voltammetric peaks in Gamry files, subtracts a user-defined baseline and reports mean ± SD peak heights over cycles."
    - name: "Electrochemical-Wavelet-Denoising"
      url: "https://github.com/deannguyen9xyz/Electrochemical-Wavelet-Denoising"
      image: "Electrochemical-Wavelet-Denoising.png"
      alt: "Noisy simulated binding curve with the denoised signal and the fitted kinetic curve"
      description: "Denoising of simulated sensor binding-kinetics data with Savitzky–Golay smoothing and wavelet thresholding, followed by an anchored kinetic fit to recover the binding rate constant."
    - name: "EIS_Randles_Fitting"
      url: "https://github.com/deannguyen9xyz/EIS_Randles_Fitting"
      image: "EIS_Randles_Fitting.png"
      alt: "Fitted charge-transfer resistance and fit error for eight fitting methods"
      description: "Fits impedance spectra to a Randles circuit with eight methods (local least squares, global optimizers and Bayesian MCMC) and compares the results."
    - name: "EIS-Fitting-Models"
      url: "https://github.com/deannguyen9xyz/EIS-Fitting-Models"
      image: "EIS-Fitting-Models.png"
      alt: "Nyquist plot of an impedance spectrum with a Randles circuit fit"
      description: "Fits impedance spectra with three equivalent circuits: Randles (sensors), modified Randles and a two-RC Thevenin model (Li-ion batteries)."

- category: "Machine learning for electrochemical sensing"
  items:
    - name: "SWV-Concentration-Prediction-ML"
      url: "https://github.com/deannguyen9xyz/SWV-Concentration-Prediction-ML"
      image: "SWV-Concentration-Prediction-ML.png"
      alt: "Simulated square-wave voltammograms for ten concentrations used as training data"
      description: "Compares 1D-CNN, LSTM/GRU and hybrid CNN–Transformer models that predict analyte concentration directly from simulated, augmented SWV curves of MIP sensors."
    - name: "cv-data-augmentation"
      url: "https://github.com/deannguyen9xyz/cv-data-augmentation"
      image: "cv-data-augmentation.png"
      alt: "A raw cyclic voltammogram and ten augmented copies"
      description: "Augmentation methods for cyclic voltammetry data (potential shift, current scaling, baseline drift, peak broadening, warping and noise) to build machine-learning training sets."

- category: "Batteries and fuel cells"
  items:
    - name: "battery-ekf-soc-estimator"
      url: "https://github.com/deannguyen9xyz/battery-ekf-soc-estimator"
      image: "battery-ekf-soc-estimator.png"
      alt: "Current profile, battery voltage and state-of-charge estimates from the extended Kalman filter and Coulomb counting"
      description: "Extended Kalman filter for Li-ion state-of-charge estimation with a 1RC equivalent-circuit model under a dynamic current profile."
    - name: "battery-hybrid-digital-twin"
      hidden: true  # not shown on the site until the model is fixed
      url: "https://github.com/deannguyen9xyz/battery-hybrid-digital-twin"
      description: "Hybrid Li-ion battery model combining a physics-based voltage model with a machine-learning residual corrector for aging-induced drift."
    - name: "Li-ion-RUL-Prediction"
      url: "https://github.com/deannguyen9xyz/Li-ion-RUL-Prediction"
      image: "Li-ion-RUL-Prediction.png"
      alt: "Predicted and true remaining useful life against cycle number for three cells"
      description: "Remaining-useful-life prediction on NASA battery degradation data, with correlation analysis and random-forest regression validated on an unseen cell."
    - name: "pem-fuel-cell-model"
      url: "https://github.com/deannguyen9xyz/pem-fuel-cell-model"
      image: "pem-fuel-cell-model.png"
      alt: "Simulated polarization and power density curves of a PEM fuel cell"
      description: "Physics-based PEM fuel cell simulator (Nernst voltage with activation, ohmic and concentration losses) giving polarization and power curves."

- category: "AI and other projects"
  items:
